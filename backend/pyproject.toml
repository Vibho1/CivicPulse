[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse - from complaint to closure, with proof (Bengaluru civic accountability layer)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "google-genai>=1.20",
    "Pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]  # UP042: keep (str, Enum) for pydantic/Gemini schema compatibility
